<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - CogniQuest</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

                        "error": "#ba1a1a",

                        "outline": "#777585",

                    },
                    "spacing": {
                        "container-margin": "20px",
                        "section-padding": "40px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-lg": ["Hanken Grotesk"],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-inverse-surface text-inverse-on-surface min-h-screen flex items-center justify-center relative overflow-hidden font-body-md antialiased selection:bg-primary selection:text-on-primary">
<!-- Atmospheric Background Elements (High-Tech Feel) -->
<div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary opacity-20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-secondary opacity-20 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[420px] px-container-margin z-10 flex flex-col items-center">
<!-- Header -->
<div class="text-center mb-section-padding w-full flex flex-col items-center gap-stack-md">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center shadow-lg transform rotate-3">
<span class="material-symbols-outlined text-[32px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                    psychology
                </span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary-fixed-dim tracking-tight">CogniQuest</h1>
<p class="font-body-md text-body-md text-inverse-on-surface/70">Enter the arena of knowledge.</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-stack-lg" onsubmit="event.preventDefault();">
<!-- Username Input -->
<div class="flex flex-col gap-stack-sm group">
<label class="font-label-md text-label-md text-inverse-on-surface/70 group-focus-within:text-primary-fixed-dim transition-colors" for="username">Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-inverse-on-surface/50 group-focus-within:text-primary-fixed-dim transition-colors pb-2">
                        person
                    </span>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant/30 focus:border-primary-fixed-dim focus:ring-0 pl-8 pb-2 font-body-lg text-body-lg text-inverse-on-surface placeholder:text-inverse-on-surface/30 transition-all" id="username" placeholder="Scholar123" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm group">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-inverse-on-surface/70 group-focus-within:text-primary-fixed-dim transition-colors" for="password">Password</label>
<a class="font-label-md text-label-md text-primary-fixed-dim hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-inverse-on-surface/50 group-focus-within:text-primary-fixed-dim transition-colors pb-2">
                        lock
                    </span>
<input class="w-full bg-transparent border-0 border-b-2 border-outline-variant/30 focus:border-primary-fixed-dim focus:ring-0 pl-8 pb-2 font-body-lg text-body-lg text-inverse-on-surface placeholder:text-inverse-on-surface/30 transition-all tracking-widest" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-0 text-inverse-on-surface/50 hover:text-inverse-on-surface pb-2 transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Action Area -->
<div class="mt-stack-sm">
<!-- Tactile Button per Style Guidance -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-lg border-b-[4px] border-on-primary-fixed-variant hover:bg-primary-container active:border-b-0 active:translate-y-[4px] transition-all flex justify-center items-center gap-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer -->
<div class="mt-section-padding text-center">
<p class="font-body-md text-body-md text-inverse-on-surface/70">
                Don't have an account? 
                <a class="font-label-lg text-label-lg text-primary-fixed-dim hover:text-primary-fixed ml-1 transition-colors relative after:content-[''] after:absolute after:w-full after:scale-x-0 after:h-[2px] after:bottom-[-2px] after:left-0 after:bg-primary-fixed after:origin-bottom-right after:transition-transform after:duration-300 hover:after:scale-x-100 hover:after:origin-bottom-left" href="#">Sign up</a>
</p>
</div>
</main>
</body></html>
