<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Edit Profile - CogniQuest</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb3b5",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#40000c",
                        "on-primary-fixed-variant": "#3631b4",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#c2c1ff",
                        "surface": "#f9f9fc",
                        "surface-container": "#eeeef0",
                        "on-secondary-fixed": "#001f28",
                        "surface-tint": "#4f4ccd",
                        "on-secondary-fixed-variant": "#004e60",
                        "outline": "#777585",
                        "on-primary-fixed": "#0c006a",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#920027",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2f3133",
                        "tertiary-container": "#cf003b",
                        "surface-container-low": "#f3f3f6",
                        "on-surface-variant": "#464554",
                        "secondary-fixed-dim": "#4cd6ff",
                        "surface-variant": "#e2e2e5",
                        "surface-dim": "#dadadc",
                        "inverse-primary": "#c2c1ff",
                        "secondary": "#00677f",
                        "primary-container": "#5856d6",
                        "tertiary": "#a2002c",
                        "background": "#f9f9fc",
                        "primary-fixed": "#e2dfff",
                        "surface-container-high": "#e8e8ea",
                        "primary": "#3f3bbd",
                        "surface-bright": "#f9f9fc",
                        "secondary-container": "#00ccf9",
                        "secondary-fixed": "#b7eaff",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e2e2e5",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffdada",
                        "error": "#ba1a1a",
                        "on-surface": "#1a1c1e",
                        "outline-variant": "#c7c4d6",
                        "on-background": "#1a1c1e",
                        "inverse-on-surface": "#f0f0f3",
                        "on-primary-container": "#e7e4ff",
                        "on-secondary-container": "#005266",
                        "on-tertiary-container": "#ffdfdf"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "container-margin": "20px",
                        "stack-md": "16px",
                        "section-padding": "40px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-lg": ["Hanken Grotesk"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Tactile Button Effect */
        .btn-tactile {
            border-bottom-width: 3px;
            border-bottom-color: theme('colors.primary');
            transition: all 0.1s ease;
        }
        .btn-tactile:active {
            transform: translateY(2px);
            border-bottom-width: 1px;
            margin-bottom: 2px;
        }

        /* Input Animations */
        .input-group {
            position: relative;
        }
        .input-focus-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: theme('colors.primary-container');
            transition: width 0.3s ease;
        }
        input:focus ~ .input-focus-line, textarea:focus ~ .input-focus-line {
            width: 100%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased pb-safe flex flex-col md:items-center">
<!-- Top App Bar (Task-Focused: Sub-page with Back action) -->
<header class="flex justify-between items-center w-full max-w-[720px] px-container-margin py-stack-sm sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant/30">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center text-primary rounded-full hover:bg-surface-container-low transition-colors" onclick="history.back()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary flex-1 text-center pr-10">Edit Profile</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[720px] px-container-margin py-stack-lg flex flex-col gap-stack-lg">
<!-- Profile Picture Section -->
<section class="flex flex-col items-center justify-center gap-stack-sm relative">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-surface shadow-[0_4px_12px_rgba(0,0,0,0.05)] bg-surface-container flex items-center justify-center relative">
<!-- Placeholder avatar using data-alt for generation -->
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="A stylized, modern 3D avatar of a sophisticated but friendly user, suitable for a gamified educational platform. The avatar should have a slightly tactile, 'squishy' 3D aesthetic, set against a pristine, light-mode background with subtle, high-key lighting. The color palette should incorporate electric blue accents (#5856d6) typical of the CogniQuest brand." src=""/>
<!-- Overlay for edit action -->
<div class="absolute inset-0 bg-inverse-surface/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200">
<span class="material-symbols-outlined text-on-primary text-3xl">photo_camera</span>
</div>
</div>
<!-- Floating edit badge -->
<button class="absolute bottom-0 right-0 w-10 h-10 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center shadow-md border-2 border-surface hover:bg-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">edit</span>
</button>
</div>
<p class="text-on-surface-variant font-label-md text-label-md mt-2">Tap to change avatar</p>
</section>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md bg-surface p-6 rounded-[12px] border border-outline-variant/30 shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
<div class="input-group flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-3 pl-10 pr-4 text-body-md focus:outline-none focus:border-transparent focus:ring-0 focus:bg-surface-container-low transition-colors" id="fullName" type="text" value="Alex Rivera"/>
<div class="input-focus-line rounded-b-lg"></div>
</div>
</div>
<div class="input-group flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">alternate_email</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-3 pl-10 pr-4 text-body-md focus:outline-none focus:border-transparent focus:ring-0 focus:bg-surface-container-low transition-colors" id="username" type="text" value="arivera_quest"/>
<div class="input-focus-line rounded-b-lg"></div>
</div>
</div>
<div class="input-group flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-3 pl-10 pr-4 text-body-md focus:outline-none focus:border-transparent focus:ring-0 focus:bg-surface-container-low transition-colors" id="email" type="email" value="alex.rivera@example.com"/>
<div class="input-focus-line rounded-b-lg"></div>
</div>
</div>
<div class="input-group flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="bio">Bio</label>
<div class="relative">
<textarea class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-3 px-4 text-body-md resize-none focus:outline-none focus:border-transparent focus:ring-0 focus:bg-surface-container-low transition-colors" id="bio" rows="3">Lifelong learner. History buff. Aiming for the Diamond League this month!</textarea>
<div class="input-focus-line rounded-b-lg"></div>
</div>
<p class="text-right text-xs text-outline mt-1">68/150</p>
</div>
</form>
<!-- Action Section -->
<div class="flex flex-col gap-stack-sm mt-4">
<button class="w-full bg-primary-container text-on-primary-container font-label-lg text-label-lg py-4 rounded-xl flex items-center justify-center gap-2 btn-tactile shadow-sm" type="button">
                Save Changes
            </button>
<button class="w-full bg-transparent text-primary font-label-lg text-label-lg py-4 rounded-xl flex items-center justify-center border border-outline-variant/50 hover:bg-surface-container-low transition-colors" onclick="history.back()" type="button">
                Cancel
            </button>
</div>
</main>
<!-- Navigation Shell SUPPRESSED: This is a task-focused screen with a clear 'Back/Cancel' action, acting as a sub-page of Profile. -->
</body></html>
